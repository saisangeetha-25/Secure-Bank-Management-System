<!DOCTYPE html>
<html>

<head>
    <title>User Login</title>

    <style>

        body{
            margin: 0;
            font-family: Segoe UI, sans-serif;
            background: #0A3D62;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h2{
            color: #0A3D62;
            margin-bottom: 20px;
        }

        input{
            padding: 12px;
            margin: 10px 0;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        button{
            width: 100%;
            padding: 12px;
            background: #0A3D62;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background: #062c47;
        }

        .register-text{
            margin-top: 15px;
            font-size: 14px;
        }

        .register-text a{
            color: #0A3D62;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>User Login</h2>

    <form method="POST">

        <input type="email" name="email" placeholder="Email" required><br>
        <input type="password" name="password" placeholder="Password" required><br>

        <button type="submit">Login</button>

    </form>

    <div class="register-text">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

</body>

</html>
