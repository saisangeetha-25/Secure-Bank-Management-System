<!DOCTYPE html>
<html>

<head>
    <title>Get Started</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial;
            background: #0A3D62;   /* BLUE BACKGROUND */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container-box{
            text-align: center;
        }

        .role-title{
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 40px;
            color: white;
        }

        .box-container{
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .role-box{
            width: 220px;
            padding: 30px;
            background: rgba(255,255,255,0.12); /* glass effect */
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .role-box:hover{
            transform: translateY(-8px);
            background: rgba(255,255,255,0.2);
        }

        .role-box a{
            text-decoration: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: block;
        }

        .role-box a:hover{
            color: #dfefff;
        }

    </style>

</head>

<body>

<div class="container-box">

    <div class="role-title">Select Your Role</div>

    <div class="box-container">

        <div class="role-box">
            <a href="/login">👤 User Login</a>
        </div>

        <div class="role-box">
            <a href="/admin-login">🛡️ Admin Login</a>
        </div>

    </div>

</div>

</body>

</html>
